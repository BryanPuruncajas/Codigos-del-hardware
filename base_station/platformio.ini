; PlatformIO config para la ESP32 de la BASE (BaseTranseiver)
; Esta placa se queda conectada por USB a tu compu, habla ESP-NOW
; con el blimp, y recibe comandos por Serial desde simple_control.py

; NOTA: 'esp32dev' es el board generico, funciona para la gran mayoria
; de placas ESP32 (DevKit, NodeMCU-32S, etc.). Si tu segunda placa es
; otro XIAO ESP32S3, cambia la linea de 'board' por:
;   board = seeed_xiao_esp32s3
; (igual que en firmware/platformio.ini del blimp)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600
